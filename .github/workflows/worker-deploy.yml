name: Avgoon Worker Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - feature/admin-users-orders
    paths:
      - 'apps/worker/**'
      - '.github/workflows/worker-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Deploy Worker to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 95918e1df4335e67e8884812b0260733
          command: deploy
          workingDirectory: apps/worker
          wranglerVersion: 4.166.0
      - name: Explain skipped deployment
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Worker typecheck passed; deployment skipped because repository secret CLOUDFLARE_API_TOKEN is not configured."
