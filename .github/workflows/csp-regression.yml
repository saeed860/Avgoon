name: CSP regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  csp-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-csp.mjs
      - run: node --check docs/js/storefront.js
      - run: node --check docs/js/admin.js
