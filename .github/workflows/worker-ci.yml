name: AVGOON Worker CI
on:
  pull_request:
    paths:
      - 'apps/worker/**'
      - '.github/workflows/worker-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - '.github/workflows/worker-ci.yml'
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/audit.json || true
          node -e "const a=require('/tmp/audit.json'); for(const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name, 'severity='+v.severity, 'direct='+v.isDirect, 'range='+v.range, 'fix='+JSON.stringify(v.fixAvailable))"
      - run: npm run typecheck
      - run: npm test
