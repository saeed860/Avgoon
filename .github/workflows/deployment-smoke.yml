name: Avgoon deployment smoke test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - feature/admin-users-orders
    paths:
      - 'docs/**'
      - 'apps/worker/**'
      - '.github/workflows/deployment-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed Worker API and CORS
        env:
          API: https://avgoon-api.i-am-saeed4700.workers.dev
          WEB: https://d94744bf.avgoon-store.pages.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS "$API/api/health" -o /tmp/health.json; then break; fi
            sleep 5
          done
          node -e "const d=require('/tmp/health.json'); if(!d.ok || d.service!=='AVGOON API') process.exit(1); console.log('API health PASS:',d.runtime)"
          curl -fsS "$API/api/categories" -o /tmp/categories.json
          node -e "const d=require('/tmp/categories.json'); if(!Array.isArray(d)||d.length<4) process.exit(1); console.log('D1 categories PASS:',d.length)"
          curl -fsS "$API/api/products?limit=5" -o /tmp/products.json
          node -e "const d=require('/tmp/products.json'); if(!Array.isArray(d.items)||typeof d.total!=='number') process.exit(1); console.log('Public catalog PASS:',d.total,'products')"
          curl -fsS -X OPTIONS "$API/api/orders" -H "Origin: $WEB" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,content-type,idempotency-key" -D /tmp/cors.headers -o /dev/null
          grep -qi "access-control-allow-origin: $WEB" /tmp/cors.headers
          grep -qi "idempotency-key" /tmp/cors.headers
          echo "CORS PASS"
          admin_status=$(curl -sS -o /tmp/admin.json -w "%{http_code}" "$API/api/admin/products")
          test "$admin_status" = "401"
          echo "Admin API protection PASS"
          otp_status=$(curl -sS -o /tmp/otp.json -w "%{http_code}" -X POST "$API/api/auth/request-otp" -H "Content-Type: application/json" --data '{"target":"smoke@example.com","channel":"email"}')
          test "$otp_status" = "503"
          echo "OTP correctly reports missing Resend secret (503)"
      - name: Verify latest Pages preview
        env:
          WEB: https://d94744bf.avgoon-store.pages.dev
        run: |
          set -euo pipefail
          curl -fsS "$WEB/" -o /tmp/store.html
          grep -q "AVGOON_API_URL" <(curl -fsS "$WEB/config.js")
          grep -q "checkoutModal" /tmp/store.html
          echo "Storefront HTML PASS"
          curl -fsS "$WEB/admin.html" -o /tmp/admin.html
          echo "Admin response bytes: $(wc -c < /tmp/admin.html)"
          grep -o ".\{0,40\}editProduct.\{0,40\}" /tmp/admin.html | head -3 || true
          grep -q "editProduct" /tmp/admin.html
          echo "Admin product editor PASS"
          grep -q "xlsx.full.min.js" /tmp/admin.html
          echo "Excel import UI PASS"
          curl -fsS "$WEB/first-admin.html" -o /tmp/first-admin.html
          grep -q "/api/admin/bootstrap" /tmp/first-admin.html
          echo "First admin setup PASS"
          echo "Pages storefront, product editor, Excel import and first-admin setup PASS"
          python3 - <<'PY'
          from pathlib import Path
          import re
          for filename in ('store.html','admin.html','first-admin.html'):
              html = Path('/tmp', filename).read_text(encoding='utf-8')
              scripts = [x for x in re.findall(r'<script\b[^>]*>(.*?)</script>', html, flags=re.I|re.S) if x.strip()]
              Path('/tmp', filename + '.js').write_text('\n'.join(scripts), encoding='utf-8')
              print(filename, 'inline scripts:', len(scripts))
          if not Path('/tmp/admin.html.js').stat().st_size:
              raise SystemExit('Admin inline JavaScript was not found')
          PY
          for jsfile in /tmp/admin.html.js /tmp/first-admin.html.js; do
            if test -s "$jsfile"; then
              if ! node --check "$jsfile" >/tmp/js-check.log 2>&1; then
                echo "JavaScript syntax failed: $jsfile"
                cat /tmp/js-check.log
                sed -n '1,100p' "$jsfile"
                exit 1
              fi
            fi
          done
          echo "Frontend JavaScript syntax PASS"
