name: Avgoon deployment smoke test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - feature/admin-users-orders
    paths:
      - 'docs/**'
      - 'apps/worker/**'
      - '.github/workflows/deployment-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed Worker API and CORS
        env:
          API: https://avgoon-api.i-am-saeed4700.workers.dev
          WEB: https://feature-admin-users-orders.avgoon-store.pages.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS "$API/api/health" -o /tmp/health.json; then break; fi
            sleep 5
          done
          node -e "const d=require('/tmp/health.json'); if(!d.ok || d.service!=='AVGOON API') process.exit(1); console.log('API health PASS:',d.runtime)"
          curl -fsS "$API/api/categories" -o /tmp/categories.json
          node -e "const d=require('/tmp/categories.json'); if(!Array.isArray(d)||d.length<4) process.exit(1); console.log('D1 categories PASS:',d.length)"
          curl -fsS "$API/api/products?limit=5" -o /tmp/products.json
          node -e "const d=require('/tmp/products.json'); if(!Array.isArray(d.items)||typeof d.total!=='number') process.exit(1); console.log('Public catalog PASS:',d.total,'products')"
          curl -fsS -X OPTIONS "$API/api/orders" -H "Origin: $WEB" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,content-type,idempotency-key" -D /tmp/cors.headers -o /dev/null
          grep -qi "access-control-allow-origin: $WEB" /tmp/cors.headers
          grep -qi "idempotency-key" /tmp/cors.headers
          echo "CORS PASS"
          admin_status=$(curl -sS -o /tmp/admin.json -w "%{http_code}" "$API/api/admin/products")
          test "$admin_status" = "401"
          echo "Admin API protection PASS"
          inquiry_status=$(curl -sS -o /tmp/inquiry-invalid.json -w "%{http_code}" -X POST "$API/api/inquiries" -H "Content-Type: application/json" --data '{"name":"Smoke Test","phone":"abcdefgh","message":"Automated validation test"}')
          echo "Inquiry invalid-phone status=$inquiry_status body=$(cat /tmp/inquiry-invalid.json)"
          test "$inquiry_status" = "400"
          spam_status=$(curl -sS -o /tmp/inquiry-spam.json -w "%{http_code}" -X POST "$API/api/inquiries" -H "Content-Type: application/json" --data '{"name":"Bot","phone":"۰۹۱۲۳۴۵۶۷۸۹","message":"Automated honeypot test","website":"https://spam.invalid"}')
          echo "Inquiry honeypot status=$spam_status body=$(cat /tmp/inquiry-spam.json)"
          test "$spam_status" = "201"
          inquiry_admin_status=$(curl -sS -o /tmp/inquiry-admin.json -w "%{http_code}" "$API/api/admin/inquiries")
          test "$inquiry_admin_status" = "401"
          echo "Inquiry validation, honeypot and admin authorization PASS"
          sms_status=$(curl -sS -o /tmp/sms.json -w "%{http_code}" -X POST "$API/api/auth/request-otp" -H "Content-Type: application/json" --data '{"target":"+4915112345678","channel":"phone"}')
          test "$sms_status" = "503"
          echo "SMS provider readiness PASS (503 until SMS integration)"
      - name: Verify latest Pages preview
        env:
          WEB: https://feature-admin-users-orders.avgoon-store.pages.dev
        run: |
          set -euo pipefail
          curl -fsSL "$WEB/" -o /tmp/store.html
          curl -fsSI "$WEB/" -D /tmp/page.headers -o /dev/null
          grep -qi "x-content-type-options: nosniff" /tmp/page.headers
          grep -qi "content-security-policy:" /tmp/page.headers
          curl -fsSI "$WEB/config.js" -D /tmp/config.headers -o /dev/null
          grep -qi "cache-control:.*no-cache" /tmp/config.headers
          echo "Pages security headers and API config cache policy PASS"
          grep -q "AVGOON_API_URL" <(curl -fsSL "$WEB/config.js")
          grep -q "checkoutModal" /tmp/store.html
          grep -q "cEmail" /tmp/store.html
          grep -q "submitConsult" /tmp/store.html
          grep -q "filterProducts('سازه‌های فلزی')" /tmp/store.html
          grep -q "filterProducts('عایق‌ها')" /tmp/store.html
          grep -q "filterProducts('ملزومات اجرا')" /tmp/store.html
          grep -q "PL_RKM39_8815.png" /tmp/store.html
          grep -q "media.adeo.com/mkp" /tmp/store.html
          grep -q "/api/inquiries" /tmp/store.html
          grep -q "avgoon_products" /tmp/store.html
          grep -q "DEMO_PRODUCTS" /tmp/store.html
          grep -q "نمونه نمایشی" /tmp/store.html
          grep -q "محصول نمایشی قابل سفارش نیست" /tmp/store.html
          grep -q "demoNotice" /tmp/store.html
          echo "Clearly labelled non-orderable demo catalog PASS"
          if grep -q "۰۲۱-۹۱۰۰۴۰۸۰\|info@avgoon.ir" /tmp/store.html; then echo "Unverified placeholder contact data found"; exit 1; fi
          grep -q "photo-thumbs" /tmp/store.html
          grep -q "setProductCardImage" /tmp/store.html
          echo "Storefront HTML PASS"
          curl -fsSL "$WEB/admin.html" -o /tmp/admin.html
          echo "Admin response bytes: $(wc -c < /tmp/admin.html)"
          grep -o ".\{0,40\}editProduct.\{0,40\}" /tmp/admin.html | head -3 || true
          grep -q "editProduct" /tmp/admin.html
          grep -q 'name="robots" content="noindex,nofollow"' /tmp/admin.html
          grep -q "inquiriesPanel" /tmp/admin.html
          grep -q "product-import-guide.html" /tmp/admin.html
          curl -fsSL "$WEB/product-import-guide.html" -o /tmp/product-import-guide.html
          grep -q "categorySlug" /tmp/product-import-guide.html
          grep -q "loadInquiries" /tmp/admin.html
          grep -q "pImages" /tmp/admin.html
          grep -q "readProductImages" /tmp/admin.html
          grep -q "pGalleryPreview" /tmp/admin.html
          grep -q "گالری چندتصویری" /tmp/product-import-guide.html
          echo "Admin product editor and image gallery PASS"
          grep -q "xlsx.full.min.js" /tmp/admin.html
          curl -fsSL "$WEB/product-import-template.csv" -o /tmp/product-template.csv
          test "$(wc -l < /tmp/product-template.csv)" -eq 1
          grep -q "^sku,name,slug,description,priceToman,stock,unit,brand,categorySlug,imageUrl,isPublished$" /tmp/product-template.csv
          echo "Blank product import template PASS"
          echo "Excel import UI PASS"
          curl -fsSL "$WEB/first-admin.html" -o /tmp/first-admin.html
          grep -q "/api/admin/bootstrap" /tmp/first-admin.html
          echo "First admin setup PASS"
          echo "Pages storefront, product editor, Excel import and first-admin setup PASS"
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/store.html','utf8');
          const safeAddCart = html.includes('addCart(&quot;\'+esc(p.id)+\'&quot;)');
          if (!safeAddCart || !html.includes("qty('${esc(p.id)}',-1)")) {
            throw new Error('UUID product IDs are not quoted in cart actions');
          }
          console.log('UUID cart action quoting PASS');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          import re
          for filename in ('store.html','admin.html','first-admin.html'):
              html = Path('/tmp', filename).read_text(encoding='utf-8')
              scripts = [x for x in re.findall(r'<script\b[^>]*>(.*?)</script>', html, flags=re.I|re.S) if x.strip()]
              Path('/tmp', filename + '.js').write_text('\n'.join(scripts), encoding='utf-8')
              print(filename, 'inline scripts:', len(scripts))
          if not Path('/tmp/admin.html.js').stat().st_size:
              raise SystemExit('Admin inline JavaScript was not found')
          PY
          for jsfile in /tmp/store.html.js /tmp/admin.html.js /tmp/first-admin.html.js; do
            if test -s "$jsfile"; then
              if ! node --check "$jsfile" >/tmp/js-check.log 2>&1; then
                echo "JavaScript syntax failed: $jsfile"
                cat /tmp/js-check.log
                sed -n '1,100p' "$jsfile"
                exit 1
              fi
            fi
          done
          echo "Frontend JavaScript syntax PASS"
