<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#20252b"><meta name="description" content="مشخصات فنی، تصاویر و اطلاعات محصول در فروشگاه تخصصی آوگون">
<title>جزئیات محصول | آوگون</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--dark:#20252b;--orange:#ef8125;--cream:#f5f4f1;--muted:#737b83;--line:#e6e5e1}
*{box-sizing:border-box}body{margin:0;color:var(--dark);font-family:Estedad,Tahoma,sans-serif}button,a{font:inherit}a{color:inherit}.wrap{width:min(1160px,calc(100% - 36px));margin:auto}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#ffffffed;backdrop-filter:blur(12px);z-index:5}.head{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{text-decoration:none;font-weight:900;font-size:22px;letter-spacing:2px}.logo small{display:block;font-size:9px;color:var(--muted);letter-spacing:3px}.btn{border:0;background:var(--orange);color:white;padding:12px 20px;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;border-radius:4px;font-weight:700;cursor:pointer}.btn.secondary{background:white;color:var(--dark);border:1px solid var(--line)}
.breadcrumb{font-size:12px;color:var(--muted);padding:24px 0}.breadcrumb a{text-decoration:none}.product{display:grid;grid-template-columns:1.05fr .95fr;gap:54px;padding-bottom:65px}.gallery{min-width:0}.main-image{height:460px;background:#f1f2f0;border:1px solid var(--line);display:grid;place-items:center}.main-image img{width:100%;height:100%;object-fit:contain}.thumbs{display:flex;gap:10px;overflow:auto;padding:12px 0}.thumbs button{flex:0 0 78px;height:68px;border:1px solid var(--line);background:white;padding:3px;cursor:pointer}.thumbs button.active{border:2px solid var(--orange)}.thumbs img{width:100%;height:100%;object-fit:contain}.info{padding:10px 0}.eyebrow{color:var(--orange);font-size:11px;font-weight:800}.info h1{font-size:clamp(26px,4vw,38px);line-height:1.5;margin:12px 0}.sku{font-size:12px;color:var(--muted)}.price{font-size:25px;font-weight:800;margin:25px 0 8px}.price small{font-size:12px;color:var(--muted);font-weight:400}.stock{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;background:#f4f5f2;font-size:12px;margin:8px 0 20px}.dot{width:8px;height:8px;border-radius:50%;background:#87928c}.description{font-size:14px;line-height:2.2;color:#596168;white-space:pre-line;border-top:1px solid var(--line);padding-top:18px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.specs{padding:45px 0 70px;background:#fafaf9}.section-title{font-size:23px;margin:0 0 22px}.spec-table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--line)}.spec-table th,.spec-table td{text-align:right;padding:15px 18px;border-bottom:1px solid var(--line);font-size:13px}.spec-table th{width:35%;background:#f5f5f2;font-weight:600}.empty{padding:22px;background:white;color:var(--muted);font-size:13px}.notice{margin:30px 0;padding:14px;background:#fff4e8;color:#7a4316;font-size:12px;line-height:2}.error{padding:65px 20px;text-align:center}.error h1{font-size:25px}.error p{color:var(--muted);line-height:2}.hidden{display:none!important}footer{background:#1c2126;color:#c4cbd0;padding:24px 0;font-size:11px}
@media(max-width:800px){.product{grid-template-columns:1fr;gap:22px}.main-image{height:360px}.info{padding:0}.specs{padding:35px 0 45px}}@media(max-width:480px){.main-image{height:290px}.wrap{width:calc(100% - 28px)}.spec-table th,.spec-table td{padding:12px 10px;font-size:12px}}
</style>
</head><body>

<main class="wrap" id="content"><div class="breadcrumb"><a href="index.html">خانه</a>　/　محصولات　/　در حال بارگذاری…</div><div class="empty">در حال دریافت اطلاعات محصول…</div></main>
<footer><div class="wrap">© ۱۴۰۵ آوگون · اطلاعات و مشخصات فنی بر اساس داده ثبت‌شده برای هر محصول نمایش داده می‌شود.</div></footer>
<script src="js/product.js"></script></body></html>
